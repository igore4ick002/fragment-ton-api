[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fragment-ton-api"
version = "0.1.12"
description = "Unofficial async client for Fragment.com, TON payments and Telegram gifts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Igor", email = "igor.ignatenko.10@mail.ru" }
]
dependencies = [
    "aiohttp>=3.9",
    "tonsdk>=1.0.15",
    "pytoniq>=0.1.40",
    "pynacl>=1.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://github.com/igore4ick002/fragment-ton-api"
Documentation = "https://github.com/igore4ick002/fragment-ton-api#readme"
Issues = "https://github.com/igore4ick002/fragment-ton-api/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "twine>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fragment_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/fragment_api"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
